<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>联系人图谱 · Salestools</title>
<style>
:root{color-scheme:light;--ink:#20252b;--muted:#59636e;--line:#dce1e6;--paper:#f7f8fa;--accent:#245fbd}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{padding:16px 20px;max-width:1600px;margin:auto}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:20px;line-height:1.4;margin:0;font-weight:650;letter-spacing:-.02em}h2{font-size:14px;margin:0 0 12px;font-weight:600}h3{font-size:20px;margin:0 0 12px;line-height:1.5}p{margin:8px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);min-height:36px;padding:6px 12px;border-radius:4px;transition:background-color .15s,border-color .15s}button:hover:not(:disabled){background:#f0f3f7;border-color:#a9b4c0}button:disabled{color:#929aa4;cursor:default;background:#fafbfc}button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#summary{color:var(--muted);font-size:13px;margin:0}#conditions{color:var(--muted);font-size:13px;margin:0 0 14px;overflow-wrap:anywhere}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.canvas{min-width:0;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
.canvas-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}.canvas-title{font-size:13px;font-weight:600;white-space:nowrap}.toolbar,.pager{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.toolbar button{min-width:36px}.toolbar #fit{margin-right:4px}
#graph{display:block;width:100%;height:580px;touch-action:none;cursor:grab;background-image:radial-gradient(#dfe3e8 .65px,transparent .65px);background-size:24px 24px}#graph:active{cursor:grabbing}#graph [data-node]{cursor:pointer}#graph [data-node].selected rect{stroke:var(--accent);stroke-width:2.5;fill:#eef4ff}#graph [data-edge].selected{stroke:var(--accent);stroke-width:3.5}
.canvas-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--muted)}.legend{display:flex;gap:16px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:20px;border-top:2px solid #74808d}.legend i.pending{border-top:2px dashed #946018}
.side{min-width:0;border-left:1px solid var(--line);padding:0 0 0 16px;max-height:710px;overflow:auto}.directory{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}.directory>summary{font-size:13px;color:var(--muted);padding:4px 0;cursor:pointer;font-weight:600}
#node-list{list-style:none;padding:0;margin:8px 0 0;max-height:170px;overflow:auto}#node-list button{width:100%;text-align:left;border-color:transparent;background:transparent;border-radius:3px;padding:7px 8px;min-height:44px}#node-list button[aria-pressed=true]{background:#eef4ff;color:#204f96}#node-list small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.loading{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0;color:var(--muted);font-size:12px}.loading p{margin:0;flex:1;min-width:160px}.loading button{border-color:transparent;background:transparent;font-size:12px;min-height:32px;padding:3px 8px}.loading button:disabled{display:none}.loading #retry:not(:disabled){color:#8a4518;border-color:#e0c5ae;background:#fff9f3}
#notice{margin:0 0 12px;padding:8px 12px;color:#784614;background:#fff6e9;border-left:3px solid #b27b24;font-size:13px;overflow-wrap:anywhere}#notice:empty{display:none}.record{border-top:1px solid var(--line);padding:12px 0}.quote,.source{font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.pager{margin:12px 0;font-size:12px}.pager button{min-height:32px;padding:4px 9px}.pager span{margin-right:auto}#detail{overflow-wrap:anywhere}.report-body{white-space:pre-wrap;font:12px/1.7 monospace;overflow-wrap:anywhere}.error{color:#9b382b}details.record>summary{font-size:13px;font-weight:500;cursor:pointer}
.search-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}.search-footer .pager{margin:0}.scope{font-size:12px;color:var(--muted)}.scope summary{cursor:pointer}.scope p{max-width:680px;margin:8px 0 0}
@media(max-width:1000px){main{padding:14px}.workspace{grid-template-columns:minmax(0,1fr) 280px;gap:12px}.side{padding-left:12px}}
@media(max-width:760px){main{padding:12px}header{gap:8px 16px}.workspace{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line);padding:16px 0 0;max-height:none}.canvas-bar{padding:8px 10px;flex-wrap:wrap}#graph{height:440px}.canvas-footer{padding:8px 10px}.directory{margin-bottom:16px}#node-list{max-height:150px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head>
<body><main>
<header><h1>联系人图谱</h1><p id="summary">等待聊天中的搜索结果</p></header><p id="conditions"></p>
<div class="loading"><p id="progress" role="status" aria-live="polite">正在连接 MCP 宿主…</p><div class="toolbar" aria-label="关系加载"><button id="stop">停止加载</button><button id="resume">继续加载</button><button id="retry">重试失败项</button></div></div><p id="notice" role="alert"></p>
<div class="workspace"><section class="canvas" aria-label="关系图谱"><div class="canvas-bar"><span class="canvas-title">人物与直接关联</span><div class="toolbar" aria-label="图谱视图"><button id="fit" title="缩放以查看全部节点">适应画布</button><button id="zoom-out" aria-label="缩小图谱">－</button><button id="zoom-in" aria-label="放大图谱">＋</button></div></div><svg id="graph" role="img" aria-label="联系人与直接关联节点"></svg><div class="canvas-footer"><div class="legend"><span><i aria-hidden="true"></i>已记录关系</span><span><i class="pending" aria-hidden="true"></i>待核实关联</span></div><span>拖动浏览 · 点击查看档案</span></div></section>
<aside class="side" aria-label="联系人档案"><details class="directory" open><summary>联系人与机构</summary><ul id="node-list" aria-label="可选择的节点"></ul></details><h2>档案与依据</h2><div id="detail">选择人物、机构或关系，查看档案与来源。</div></aside></div>
<div class="search-footer"><div class="pager"><button id="search-prev">上一页搜索</button><button id="search-next">下一页搜索</button></div><details class="scope"><summary>资料与展示范围</summary><p>已记录关系不等于人工核实。仅展示当前搜索页命中节点的全部直接职业关联，不递归扩展。补充节点不计入匹配数，未加载或失败不表示没有关系。待核实关联仅包含命中主体自身的线索，不涵盖其他主体指向它的入向线索。</p></details></div>
</main><!--SCRIPT--></body></html>
