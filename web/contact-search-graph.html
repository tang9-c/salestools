<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>联系人图谱 · Salestools</title>
<style>
:root{color-scheme:light;--ink:#153b35;--muted:#5a716a;--line:#d1ded7;--paper:#f5f7f1;--accent:#166859}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
main{padding:24px;max-width:1440px;margin:auto}header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
.eyebrow{font:11px monospace;letter-spacing:.14em;color:var(--muted)}h1{font-size:28px;margin:8px 0;font-weight:650}h2{font-size:17px}p{line-height:1.7;margin:8px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:6px}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #d29530;outline-offset:2px}
.toolbar,.pager,.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar{margin:12px 0}.legend{font-size:12px;color:var(--muted);margin:10px 0}.legend span{padding-right:12px}.legend b{font-size:18px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.canvas{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}svg{display:block;width:100%;height:510px;touch-action:none;background-image:radial-gradient(#dce5dd .8px,transparent .8px);background-size:20px 20px}
.labels{display:flex;justify-content:space-around;padding:12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.side{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;max-height:680px;overflow:auto}
#node-list{list-style:none;padding:0;max-height:220px;overflow:auto}#node-list button{width:100%;text-align:left;margin-bottom:5px}#node-list small{display:block;color:var(--muted);margin-top:4px}
#progress,#notice{color:var(--muted)}#notice:empty{display:none}.record{border-top:1px solid var(--line);padding:10px 0}.quote{font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.source{font-size:12px;overflow-wrap:anywhere}.pager{margin:10px 0}#detail{overflow-wrap:anywhere}.report-body{white-space:pre-wrap;font:12px/1.7 monospace;overflow-wrap:anywhere}.error{color:#9d432b}
@media(max-width:720px){main{padding:16px}.workspace{grid-template-columns:1fr}.side{max-height:none}svg{height:400px}}
</style></head>
<body><main>
<header><div class="eyebrow">SALESTOOLS / CONTACT NETWORK</div><h1>联系人图谱</h1><p id="summary">等待聊天中的搜索结果</p><p id="conditions"></p></header>
<div class="toolbar"><button id="stop">停止加载</button><button id="resume">继续加载</button><button id="retry">重试失败项</button><button id="fit">适应画布</button><button id="zoom-in" aria-label="放大图谱">＋</button><button id="zoom-out" aria-label="缩小图谱">－</button></div>
<p id="progress" role="status" aria-live="polite">正在连接 MCP 宿主…</p><p id="notice" role="alert"></p>
<div class="legend"><span><b>—</b> 正式关系（不等于人工核实）</span><span><b>┄</b> 待核实关联</span><span>仅当前搜索页的一跳职业关系；不递归</span></div>
<div class="workspace"><section class="canvas" aria-label="关系图谱"><div class="labels"><span>人物</span><span>机构</span><span>项目 / 未加载</span></div><svg id="graph" role="img" aria-label="联系人与直接关联节点"></svg></section>
<aside class="side"><h2>节点</h2><ul id="node-list" aria-label="可选择的节点"></ul><h2>档案与依据</h2><div id="detail">选择节点或关系查看来源。</div></aside></div>
<div class="pager"><button id="search-prev">上一页搜索</button><button id="search-next">下一页搜索</button></div>
<p class="quote">补充节点不计入搜索匹配数。未加载或失败不表示没有关系。待核实关联仅包含命中主体自身的线索，不涵盖其他主体指向它的入向线索。</p>
</main><!--SCRIPT--></body></html>
