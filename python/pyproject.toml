[project]
name = "contact-worker"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "docling>=2.105.0,<3.0.0",
  "pypdf>=6.0.0,<7.0.0",
  "Pillow>=11.0.0,<13.0.0",
]

[build-system]
requires = ["hatchling>=1.26.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contact_worker"]

[dependency-groups]
dev = ["pytest>=8.0.0,<10.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
  "ignore:.*force_full_page_ocr.*:DeprecationWarning:pydantic.main",
  "ignore:This field is deprecated.*:DeprecationWarning:docling.pipeline.standard_pdf_pipeline",
  "ignore:deprecated:DeprecationWarning:docling.models.stages.ocr.rapid_ocr_model",
  "ignore:Using padding='same'.*:UserWarning:torch.nn.modules.conv",
]
