[project]
name = "contact-worker"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "docling>=2.130.0,<3.0.0",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "pypdf>=6.0.0,<7.0.0",
  "Pillow>=11.0.0,<13.0.0",
]

[build-system]
requires = ["hatchling>=1.26.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contact_worker"]

[dependency-groups]
dev = ["pytest>=8.0.0,<10.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
  "ignore:.*force_full_page_ocr.*:DeprecationWarning:pydantic.main",
  "ignore:This field is deprecated.*:DeprecationWarning:docling.pipeline.standard_pdf_pipeline",
  "ignore:deprecated:DeprecationWarning:docling.models.stages.ocr.rapid_ocr_model",
  "ignore:Using padding='same'.*:UserWarning:torch.nn.modules.conv",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
