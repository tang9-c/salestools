name: Publish container image

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tang9-c/salestools

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free disk space for contact runtime builds
        run: |
          set -euo pipefail
          df -h /
          du -sh /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and smoke native architecture
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          docker buildx build --platform "linux/${{ matrix.arch }}" --load \
            --tag "$image" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --cache-from "type=gha,scope=salestools-${{ matrix.arch }}" \
            --cache-to "type=gha,mode=max,scope=salestools-${{ matrix.arch }}" .
          timeout 30m docker run --rm --network none --platform "linux/${{ matrix.arch }}" \
            --read-only --tmpfs /tmp:rw,uid=1000,gid=1000,size=1g \
            --tmpfs /data:rw,uid=1000,gid=1000,size=64m \
            "$image" /opt/contact-worker/.venv/bin/python /usr/local/bin/contact-runtime-smoke.py
          timeout 20m docker run --rm --network none --platform "linux/${{ matrix.arch }}" \
            --init --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 4g --cpus 2 --pids-limit 64 \
            --tmpfs /tmp:rw,uid=1000,gid=1000,size=1g \
            "$image" node /usr/local/bin/contact-container-smoke.mjs

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested architecture
        run: docker push "$REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}-${{ matrix.arch }}"

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version and latest manifests
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          docker buildx imagetools create \
            -t "$image:$GITHUB_REF_NAME" -t "$image:latest" \
            "$image:${GITHUB_REF_NAME}-amd64" "$image:${GITHUB_REF_NAME}-arm64"
          manifest="$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME")"
          printf '%s\n' "$manifest"
          grep -q 'linux/amd64' <<< "$manifest"
          grep -q 'linux/arm64' <<< "$manifest"
