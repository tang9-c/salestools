name: Contact graph macOS artifact

on:
  workflow_dispatch:
  push:
    branches: [ci/contact-graph-macos-artifact]
    paths:
      - .github/workflows/contact-graph-macos.yml
      - rust/contact-graph/**

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and test native binary
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked --release --manifest-path rust/contact-graph/Cargo.toml
          cargo test --locked --manifest-path rust/contact-graph/Cargo.toml
          file rust/contact-graph/target/release/contact-graph
          otool -L rust/contact-graph/target/release/contact-graph

      - name: Package binary with revision and checksum
        run: |
          set -euo pipefail
          mkdir contact-graph-macos-arm64
          cp rust/contact-graph/target/release/contact-graph contact-graph-macos-arm64/
          git rev-parse HEAD > contact-graph-macos-arm64/source-sha.txt
          (cd contact-graph-macos-arm64 && shasum -a 256 contact-graph source-sha.txt > SHA256SUMS)
          tar -czf contact-graph-macos-arm64.tar.gz contact-graph-macos-arm64

      - name: Upload tested native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contact-graph-macos-arm64-${{ github.sha }}
          path: contact-graph-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
